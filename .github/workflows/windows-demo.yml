# The Windows test kit, run on GitHub's Windows runner — docs/plans/PORTABILITY.md
# § Step 5, mac-demo.yml's twin.
#
# ci.yml's Windows job has ffmpeg and nothing else, so every render and
# transcription test skips there. This job runs scripts/windows_trial.ps1 the
# way a tester does — portable uv, ffmpeg, auto-editor, espeak-ng and Shotcut's
# melt into one folder, whisper from uv, then docs/DEMO.md to a render — under
# Windows PowerShell 5.1, which is what a stock Windows runs it with. Then
# scripts/trial_check.py judges what the run printed and rendered. The kit
# exits 0 on a render that disagrees with the timeline, because it was written
# for a person who reads the report, so its exit code is never the verdict here.
#
# It is not a person on a PC: the runner is Windows Server, nothing prompts,
# and nobody reads the instructions. Those stay the Windows test issue form's
# question, and a green run here does not replace README.md's "never been run
# on Windows" sentence on its own.
#
# Windows minutes bill at 2x while the repo is private, so this runs only when
# something the demo exercises changes, and by hand.

name: windows-demo

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/windows_trial.ps1"
      - "scripts/trial_check.py"
      - "scripts/make_demo.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # `powershell`, not the step's own pwsh: the kit is written for 5.1, and
      # a pass under 7 would say nothing about the shell a person has.
      # -Unattended answers the kit's two prompts: it starts, and declines to
      # open the editor at the end.
      - name: the Windows test kit
        shell: pwsh
        env:
          LUCID_TRIAL_REPORT: ${{ runner.temp }}\lucid-windows-report.zip
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows_trial.ps1 -Unattended
      # The runner's own Python, since the check is stdlib-only and the kit may
      # have stopped before uv arrived; the kit's ffmpeg, since the check reads
      # the frames with it and the runner has none on PATH.
      - name: judge the run
        if: always()
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $trial = Join-Path $env:LOCALAPPDATA 'lucid-windows-trial'
          $ffmpeg = Get-ChildItem -LiteralPath (Join-Path $trial 'tools\ffmpeg') -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ffmpeg) { $env:PATH = "$($ffmpeg.DirectoryName);$env:PATH" }
          python scripts\trial_check.py $trial
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lucid-windows-report
          path: |
            ${{ runner.temp }}\lucid-windows-report.zip
            ~\AppData\Local\lucid-windows-trial\report.txt
          if-no-files-found: warn
