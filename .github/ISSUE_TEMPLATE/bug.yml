name: Bug
description: proofcut ran, and did the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If `proofcut doctor` shows a ✗, the "Install trouble" form is the quicker route.
        Please don't attach footage you don't own, or anything you'd mind being public.
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The CLI command, the MCP tool call, or what you did in the web workspace.
      render: text
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
      description: |
        For a render, say what is wrong in the file itself (a missing cut, silence, a
        frame, a caption) — several of proofcut's tools exit 0 on a bad render.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Which client
      options:
        - CLI
        - MCP (Claude Code, the plugin, or another agent)
        - Web workspace (proofcut web / proofcut open)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `uv run proofcut --version`
      placeholder: proofcut 0.23.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `uv run proofcut doctor`
      description: Optional, but it answers most follow-up questions. Edit out your username if you like.
      render: text
