<svg xmlns="http://www.w3.org/2000/svg" width="{{width}}" height="{{height}}" viewBox="0 0 1920 {{view_height}}">
  <rect x="0" y="0" width="1920" height="{{view_height}}" fill="{{ink}}"/>
  <text x="960" y="{{mid_y}}" text-anchor="middle" font-family="{{title_font}}" font-size="220" font-weight="700" fill="{{paper}}">{{mark}}</text>
  <g transform="translate(0, {{note_y}})">
    <text x="960" y="0" text-anchor="middle" font-family="{{title_font}}" font-size="56" font-weight="700" fill="{{paper}}">{{footnote}}</text>
    <rect x="870" y="70" width="180" height="4" fill="{{amber}}" opacity="0.85"/>
    <text x="960" y="150" text-anchor="middle" font-family="{{body_font}}" font-size="50" font-weight="400" fill="{{paper}}">{{line1}}</text>
    <text x="960" y="228" text-anchor="middle" font-family="{{body_font}}" font-size="44" font-weight="400" fill="{{paper}}" fill-opacity="0.7">{{line2}}</text>
  </g>
</svg>
