<svg xmlns="http://www.w3.org/2000/svg" width="{{width}}" height="{{height}}" viewBox="0 0 1920 {{view_height}}">
  <rect x="0" y="0" width="1920" height="{{view_height}}" fill="{{paper}}"/>
  <text x="140" y="232" font-family="{{title_font}}" font-size="122" font-weight="700" fill="{{ink}}">{{title}}<tspan dx="36" font-size="66" font-weight="400" fill="{{muted}}">({{year}})</tspan></text>
  <g transform="translate(140, 330)">{{stars}}</g>
  <text x="140" y="452" font-family="{{body_font}}" font-size="42" fill="{{muted}}">{{date_line}}</text>
  <text x="140" y="572" font-family="{{quote_font}}" font-size="46" font-weight="600" fill="{{ink}}">{{quote}}</text>
  <text x="1780" y="{{foot_y}}" text-anchor="end" font-family="{{title_font}}" font-size="52" font-weight="{{mark_weight}}" fill="{{muted}}">{{mark}}</text>
</svg>
