<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Paired with app.css's `env(safe-area-inset-*)` padding, same as
         index.html's — each is a no-op without the other. An iPhone home-screen
         shortcut opens standalone, with the status bar over the page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>proofcut</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
    <!-- Classic, before the body, same reason as index.html's: a module is
         deferred, so the page would paint in the wrong theme first. -->
    <script src="/static/theme.js"></script>
  </head>
  <body class="picker">
    <div class="picker-shell">
      <div class="picker-header">
        <span class="brand serif-accent">proofcut</span>
        <span class="sep">/</span>
        <span>projects</span>
        <span class="spacer"></span>
        <button id="theme" type="button" title="theme">◐</button>
      </div>
      <p class="picker-root">under <span id="root">…</span></p>
      <!-- The first-run card (docs/plans/POLISH.md § Step 06). Empty and `hidden`
           until picker.js decides this root needs one — which it does when
           the scan comes back with nothing, or when someone asks for a new
           project, or when a listed project turns out to have no timeline
           yet. It is built in JS like every card below it, so there is one
           place that knows what a step looks like.

           `[hidden]` is honoured here because nothing in app.css gives
           #setup a `display:` of its own — the trap that cost both toolbars
           and the pad popover at once (CLAUDE.md). Its children are what
           carry layout rules. -->
      <div id="setup" class="setup" hidden></div>
      <div id="list" class="picker-list">
        <p class="picker-empty">scanning…</p>
      </div>
    </div>
    <div id="toast" hidden></div>
    <script type="module" src="/static/picker.js"></script>
  </body>
</html>
