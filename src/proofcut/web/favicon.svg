<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two clips and a playhead: the timeline, which is what the window is.
       Fixed colours rather than tokens — a favicon is painted by the browser
       chrome, which never sees this page's stylesheet. The pastels are the
       lavender and mint of the V2 and A1 lanes, mid-way between the light and
       dark themes' versions so it reads on either tab bar. -->
  <rect x="3" y="6" width="20" height="8" rx="2" fill="#a99ccc" />
  <rect x="3" y="18" width="14" height="8" rx="2" fill="#8bc0a8" />
  <rect x="24.5" y="3" width="2" height="26" rx="1" fill="#3f7ad1" />
</svg>
