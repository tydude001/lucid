[project]
name = "lucid"
version = "0.12.0"
description = "Open-source, local-first AI video editor — an MCP server over ffmpeg, whisper, and OpenTimelineIO"
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
# The code is PolyForm Shield 1.0.0 (LICENSE). The vendored typefaces are not
# covered by it and carry their
# own OFL-1.1 texts beside them, which ship in the package because they sit
# inside it: src/lucid/fonts/ (the caption face, FONTS.md) and src/lucid/web/
# (the three UI faces, web/FONTS.md).
license-files = ["LICENSE"]
authors = [
    { name = "tydude001", email = "tylergrose321@gmail.com" }
]
# Pinned below 3.14: OpenTimelineIO 0.18.1 ships cp39-cp313 wheels and no cp314.
# Every other dep already covers 3.14. Revisit when OTIO publishes cp314.
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=1.2",
    "opentimelineio>=0.18.1",
]

[project.scripts]
lucid = "lucid.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
